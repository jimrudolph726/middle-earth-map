<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>D3 + ELK Tolkien Family Tree with Couple Nodes</title>

  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/elkjs/lib/elk.bundled.js"></script>
</head>

<body class="family-tree-page">
  <div id="tree">
    <nav class="atlas-map-nav" aria-label="Atlas navigation">
      <a class="atlas-map-nav__link atlas-map-nav__link--home" href="../index.html">
        <i class="material-icons">home</i>
        <span>Home</span>
      </a>

      <details class="atlas-map-nav__menu">
        <summary class="atlas-map-nav__toggle">
          <span class="atlas-map-nav__toggle-label">
            <i class="material-icons">map</i>
            <span>Maps</span>
          </span>
          <i class="material-icons atlas-map-nav__chevron">expand_more</i>
        </summary>

        <div class="atlas-map-nav__dropdown">
          <a class="atlas-map-nav__link" href="../maps/middle_earth/middle-earth.html">
            <i class="material-icons">map</i>
            <span>Middle-earth</span>
          </a>
          <a class="atlas-map-nav__link" href="../maps/numenor/numenor.html">
            <i class="material-icons">map</i>
            <span>Numenor</span>
          </a>
          <a class="atlas-map-nav__link" href="../maps/beleriand/beleriand.html">
            <i class="material-icons">map</i>
            <span>Beleriand</span>
          </a>
          <a class="atlas-map-nav__link" href="../maps/the_shire/the_shire.html">
            <i class="material-icons">map</i>
            <span>The Shire</span>
          </a>
          <a class="atlas-map-nav__link atlas-map-nav__link--current" href="family_tree.html" aria-current="page">
            <i class="material-icons">account_tree</i>
            <span>Family Tree</span>
          </a>
        </div>
      </details>
      <button id="reset-view">Reset View</button>
    </nav>

    <div class="hint">Drag to move • Scroll to zoom • Click a person for full bio</div>
  </div>

  <section id="character-sheet" class="character-sheet hidden">
    <div class="character-sheet__inner">
      <button id="back-to-tree" class="back-button">← Back to family tree</button>
      <div id="character-sheet-content"></div>
    </div>
  </section>

  <script>
    const placeholder = "https://placehold.co/220x220/f5f0e6/2f2a1f?text=";

    const people = {
      arador: {
        id: "arador",
        name: "Arador",
        title: "Chieftain of the Dúnedain",
        house: "House of Isildur",
        realm: "Dúnedain of the North",
        born: "T.A. 2700",
        image: placeholder + "Arador",
        bio: "Father of Arathorn II."
      },
      arathorn: {
        id: "arathorn",
        name: "Arathorn",
        title: "Chieftain of the Dúnedain",
        house: "House of Isildur",
        realm: "Dúnedain of the North",
        born: "T.A. 2873",
        image: placeholder + "Arathorn",
        bio: "Arathorn II was the father of Aragorn and a chieftain of the Dúnedain. His line preserved the royal inheritance of Isildur in the North."
      },
      aragorn: {
        id: "aragorn",
        name: "Aragorn",
        title: "King Elessar",
        house: "House of Isildur",
        realm: "Reunited Kingdom",
        born: "T.A. 2931",
        image: "assets/aragorn.png",
        bio: "Aragorn, son of Arathorn, was heir of Isildur and became King of the Reunited Kingdom after the War of the Ring."
      },
      arwen: {
        id: "arwen",
        name: "Arwen",
        title: "Evenstar",
        house: "House of Elrond",
        realm: "Rivendell / Gondor",
        born: "T.A. 241",
        image: "assets/arwen.png",
        bio: "Arwen Undómiel, daughter of Elrond, chose a mortal life and became Queen of the Reunited Kingdom."
      },
      eldarion: {
        id: "eldarion",
        name: "Eldarion",
        title: "Son of Aragorn and Arwen",
        house: "House of Isildur",
        realm: "Reunited Kingdom",
        born: "Fourth Age",
        image: placeholder + "Eldarion",
        bio: "Eldarion was the son and heir of Aragorn and Arwen, continuing the royal line after King Elessar."
      },
        unknown_daughters: {
        id: "unknown_daughters",
        name: "Unknown Daughters",
        title: "Daughters of Aragorn and Arwen",
        house: "House of Isildur",
        realm: "Reunited Kingdom",
        born: "Fourth Age",
        image: placeholder + "Eldarion",
        bio: "Daughters of Aragorn and Arwen."
      }
    };

    const relationships = {
      couples: [
        {
          id: "couple-aragorn-arwen",
          partners: ["aragorn", "arwen"],
          children: ["eldarion", "unknown_daughters"],
          label: "Marriage"
        },
      ],
      parentChild: [
        { source: "arador", target: "arathorn" },
        { source: "arathorn", target: "aragorn" },

      ]
    };

    const width = 1200;
    const height = 800;
    const cardWidth = 170;
    const cardHeight = 104;
    const coupleNodeWidth = 42;
    const coupleNodeHeight = 28;
    const portraitRadius = 28;
    const descentLineCardGap = 10;

    const svg = d3.select("#tree")
      .append("svg")
      .attr("viewBox", `0 0 ${width} ${height}`)
      .attr("width", "100%")
      .attr("height", "100%");

    const zoomLayer = svg.append("g");
    const linkLayer = zoomLayer.append("g");
    const spouseLineLayer = zoomLayer.append("g");
    const descentLineLayer = zoomLayer.append("g");
    const coupleNodeLayer = zoomLayer.append("g");
    const nodeLayer = zoomLayer.append("g");

    const zoom = d3.zoom()
      .scaleExtent([0.2, 3])
      .on("zoom", event => {
        zoomLayer.attr("transform", event.transform);
      });

    svg.call(zoom);

    let initialTransform = d3.zoomIdentity.translate(250, 80).scale(0.95);
    svg.call(zoom.transform, initialTransform);

    document.querySelector("#reset-view").addEventListener("click", () => {
      svg.transition().duration(500).call(zoom.transform, initialTransform);
    });

    document.querySelector("#back-to-tree").addEventListener("click", () => {
      document.querySelector("#character-sheet").classList.add("hidden");
    });

    const elk = new ELK();

    function makeCurve(source, target, sourceOffsetY = 0, targetOffsetY = 0) {
      const startX = source.x;
      const startY = source.y + sourceOffsetY;
      const endX = target.x;
      const endY = target.y + targetOffsetY;
      const midY = (startY + endY) / 2;

      return `
        M ${startX},${startY}
        C ${startX},${midY}
          ${endX},${midY}
          ${endX},${endY}
      `;
    }

    function assertValidData() {
      const personIds = new Set(Object.keys(people));
      const coupleIds = new Set(relationships.couples.map(couple => couple.id));
      const errors = [];

      Object.entries(people).forEach(([key, person]) => {
        if (person.id !== key) {
          errors.push(`people.${key}.id is "${person.id}" but should match key "${key}".`);
        }
      });

      relationships.parentChild.forEach((link, index) => {
        if (!personIds.has(link.source)) errors.push(`parentChild[${index}].source "${link.source}" is not in people.`);
        if (!personIds.has(link.target)) errors.push(`parentChild[${index}].target "${link.target}" is not in people.`);
      });

      relationships.couples.forEach((couple, coupleIndex) => {
        if (!couple.id) errors.push(`couples[${coupleIndex}] is missing an id.`);
        if (coupleIds.has(couple.id) === false) errors.push(`couples[${coupleIndex}] has an invalid id.`);

        couple.partners.forEach((partnerId, partnerIndex) => {
          if (!personIds.has(partnerId)) {
            errors.push(`couples[${coupleIndex}].partners[${partnerIndex}] "${partnerId}" is not in people.`);
          }
        });

        couple.children.forEach((childId, childIndex) => {
          if (!personIds.has(childId)) {
            errors.push(`couples[${coupleIndex}].children[${childIndex}] "${childId}" is not in people.`);
          }
        });
      });

      if (errors.length > 0) {
        throw new Error(`Family tree data validation failed:\n${errors.join("\n")}`);
      }

      console.info("Family tree data validation passed.");
    }

    function getTypicalGenerationGap(nodeById) {
      const gaps = relationships.parentChild
        .map(link => {
          const parent = nodeById.get(link.source);
          const child = nodeById.get(link.target);
          return parent && child ? child.y - parent.y : null;
        })
        .filter(gap => Number.isFinite(gap) && gap > 0);

      if (gaps.length === 0) return 160;

      const sortedGaps = [...gaps].sort((a, b) => a - b);
      return sortedGaps[Math.floor(sortedGaps.length / 2)];
    }

    async function drawTree() {
      assertValidData();

      const coupleIds = relationships.couples.map(couple => couple.id);

      const elkChildren = [
        ...Object.keys(people).map(id => ({
          id,
          width: cardWidth,
          height: cardHeight
        })),
        ...relationships.couples.map(couple => ({
          id: couple.id,
          width: coupleNodeWidth,
          height: coupleNodeHeight
        }))
      ];

      const elkEdges = [
        ...relationships.parentChild.map((link, index) => ({
          id: `direct-parent-edge-${index}`,
          sources: [link.source],
          targets: [link.target]
        })),
        ...relationships.couples.flatMap(couple => {
          const partnerEdges = couple.partners.map((partnerId, index) => ({
            id: `${couple.id}-partner-${index}`,
            sources: [partnerId],
            targets: [couple.id]
          }));

          const childEdges = couple.children.map((childId, index) => ({
            id: `${couple.id}-child-${index}`,
            sources: [couple.id],
            targets: [childId]
          }));

          return [...partnerEdges, ...childEdges];
        })
      ];

      const elkGraph = {
        id: "root",
        layoutOptions: {
          "elk.algorithm": "layered",
          "elk.direction": "DOWN",
          "elk.spacing.nodeNode": "90",
          "elk.layered.spacing.nodeNodeBetweenLayers": "90",
          "elk.layered.nodePlacement.strategy": "NETWORK_SIMPLEX",
          "elk.layered.crossingMinimization.strategy": "LAYER_SWEEP",
          "elk.edgeRouting": "ORTHOGONAL",
          "elk.padding": "[top=60,left=60,bottom=60,right=60]"
        },
        children: elkChildren,
        edges: elkEdges
      };

      const layout = await elk.layout(elkGraph);

      const normalNodes = layout.children
        .filter(node => !coupleIds.includes(node.id))
        .map(node => ({
          id: node.id,
          x: node.x + cardWidth / 2,
          y: node.y + cardHeight / 2,
          width: cardWidth,
          height: cardHeight
        }));

      const coupleNodes = layout.children
        .filter(node => coupleIds.includes(node.id))
        .map(node => ({
          id: node.id,
          x: node.x + coupleNodeWidth / 2,
          y: node.y + coupleNodeHeight / 2,
          width: coupleNodeWidth,
          height: coupleNodeHeight,
          label: relationships.couples.find(couple => couple.id === node.id)?.label || "♥"
        }));

      const nodeById = new Map([
        ...normalNodes.map(d => [d.id, d]),
        ...coupleNodes.map(d => [d.id, d])
      ]);

      const verticalConnectionLength = getTypicalGenerationGap(nodeById) - cardHeight + descentLineCardGap;

      function getReferenceCouple() {
        return relationships.couples.find(couple => couple.id === "couple-arador-wife") || relationships.couples[0];
      }

      function getReferenceSpouseCenterGap() {
        const referenceCouple = getReferenceCouple();
        if (!referenceCouple) return cardWidth + 36;

        const partnerA = nodeById.get(referenceCouple.partners[0]);
        const partnerB = nodeById.get(referenceCouple.partners[1]);

        if (!partnerA || !partnerB) return cardWidth + 36;

        return Math.abs(partnerB.x - partnerA.x);
      }

      function normalizeCouplePartners() {
        const referenceSpouseCenterGap = getReferenceSpouseCenterGap();

        relationships.couples.forEach(couple => {
          const partnerA = nodeById.get(couple.partners[0]);
          const partnerB = nodeById.get(couple.partners[1]);

          if (!partnerA || !partnerB) return;

          const horizontalDirection = partnerB.x >= partnerA.x ? 1 : -1;
          partnerB.x = partnerA.x + horizontalDirection * referenceSpouseCenterGap;
          partnerB.y = partnerA.y;
        });
      }

      function positionCoupleFamilies() {
        // Post-process couple families so children are visually centered under the spouse line.
        // ELK still does the hard work of spacing generations, but this makes the genealogy
        // convention cleaner: spouse line midpoint -> vertical descent line -> child.
        relationships.couples.forEach(couple => {
          const partnerA = nodeById.get(couple.partners[0]);
          const partnerB = nodeById.get(couple.partners[1]);
          const coupleNode = nodeById.get(couple.id);

          if (!partnerA || !partnerB || !coupleNode) return;

          const spouseMidpointX = (partnerA.x + partnerB.x) / 2;
          const spouseY = (partnerA.y + partnerB.y) / 2;

          coupleNode.x = spouseMidpointX;
          coupleNode.y = spouseY;

          couple.children.forEach(childId => {
            const child = nodeById.get(childId);
            if (!child) return;

            child.x = spouseMidpointX;
            child.y = spouseY + verticalConnectionLength + cardHeight / 2 - descentLineCardGap;
          });
        });
      }

      positionCoupleFamilies();

      // Direct parent-child links should read like the couple descent lines:
      // centered, vertical, and using the same generation spacing.
      relationships.parentChild.forEach(link => {
        const parent = nodeById.get(link.source);
        const child = nodeById.get(link.target);

        if (!parent || !child) return;

        child.x = parent.x;
        child.y = parent.y + cardHeight - descentLineCardGap + verticalConnectionLength;
      });

      // A direct-parent adjustment can move one spouse off the couple's shared row
      // and stretch the couple apart, so normalize the spouse pair before
      // placing spouse/child connectors.
      normalizeCouplePartners();

      // A direct-parent adjustment can move a spouse, so run the couple positioning
      // pass again to keep every vertical connector at the same fixed length.
      positionCoupleFamilies();

      const graphWidth = layout.width || width;
      const graphHeight = layout.height || height;
      const scale = Math.min(1, Math.max(0.45, Math.min(width / graphWidth, height / graphHeight) * 0.85));
      initialTransform = d3.zoomIdentity.translate(120, 80).scale(scale);
      svg.call(zoom.transform, initialTransform);

      const directParentLinks = relationships.parentChild.map(link => ({
        source: nodeById.get(link.source),
        target: nodeById.get(link.target),
        type: "direct-parent"
      }));

      const spouseLines = relationships.couples.map(couple => {
        const partnerA = nodeById.get(couple.partners[0]);
        const partnerB = nodeById.get(couple.partners[1]);

        const leftPartner = partnerA.x < partnerB.x ? partnerA : partnerB;
        const rightPartner = partnerA.x < partnerB.x ? partnerB : partnerA;
        const spouseY = (leftPartner.y + rightPartner.y) / 2;
        const midpointX = (leftPartner.x + rightPartner.x) / 2;

        return {
          leftPartner,
          rightPartner,
          spouseY,
          midpointX
        };
      });

      const descentLines = relationships.couples.flatMap(couple => {
        const partnerA = nodeById.get(couple.partners[0]);
        const partnerB = nodeById.get(couple.partners[1]);
        const spouseY = (partnerA.y + partnerB.y) / 2;
        const midpointX = (partnerA.x + partnerB.x) / 2;

        return couple.children.map(childId => ({
          midpointX,
          spouseY,
          child: nodeById.get(childId)
        }));
      });

      console.assert(
        descentLines.every(d => Number.isFinite(d.midpointX) && Number.isFinite(d.spouseY) && d.child),
        "Each couple descent line should have a valid midpoint and child."
      );

      linkLayer.selectAll(".parent-link")
        .data(directParentLinks)
        .enter()
        .append("line")
        .attr("class", "parent-link")
        .attr("x1", d => d.source.x)
        .attr("y1", d => d.source.y + cardHeight / 2)
        .attr("x2", d => d.target.x)
        .attr("y2", d => d.target.y - cardHeight / 2 + descentLineCardGap);

      spouseLineLayer.selectAll(".spouse-line")
        .data(spouseLines)
        .enter()
        .append("line")
        .attr("class", "spouse-line")
        .attr("x1", d => d.leftPartner.x + cardWidth / 2)
        .attr("y1", d => d.spouseY)
        .attr("x2", d => d.rightPartner.x - cardWidth / 2)
        .attr("y2", d => d.spouseY);

      descentLineLayer.selectAll(".descent-line")
        .data(descentLines)
        .enter()
        .append("line")
        .attr("class", "descent-line")
        .attr("x1", d => d.midpointX)
        .attr("y1", d => d.spouseY)
        .attr("x2", d => d.midpointX)
        .attr("y2", d => d.child.y - cardHeight / 2 + descentLineCardGap);

      const coupleNode = coupleNodeLayer.selectAll(".couple-node")
        .data(coupleNodes)
        .enter()
        .append("g")
        .attr("class", "couple-node")
        .attr("transform", d => `translate(${d.x}, ${d.y})`);

      coupleNode.append("rect")
        .attr("x", -coupleNodeWidth / 2)
        .attr("y", -coupleNodeHeight / 2)
        .attr("width", coupleNodeWidth)
        .attr("height", coupleNodeHeight)
        .attr("rx", 14);

      coupleNode.append("text")
        .attr("y", 1)
        .text("♥");

      const node = nodeLayer.selectAll(".node")
        .data(normalNodes)
        .enter()
        .append("g")
        .attr("class", "node")
        .attr("transform", d => `translate(${d.x}, ${d.y})`)
        .on("click", (event, d) => {
          event.stopPropagation();
          showCharacterSheet(d.id);
        });

      node.append("rect")
        .attr("class", "node-card")
        .attr("x", -cardWidth / 2)
        .attr("y", -cardHeight / 2)
        .attr("width", cardWidth)
        .attr("height", cardHeight);

      node.append("circle")
        .attr("class", "portrait-ring")
        .attr("cx", 0)
        .attr("cy", -24)
        .attr("r", portraitRadius + 3);

      node.append("clipPath")
        .attr("id", d => `clip-${d.id}`)
        .append("circle")
        .attr("cx", 0)
        .attr("cy", -24)
        .attr("r", portraitRadius);

      node.append("image")
        .attr("href", d => people[d.id].image)
        .attr("x", -portraitRadius)
        .attr("y", -24 - portraitRadius)
        .attr("width", portraitRadius * 2)
        .attr("height", portraitRadius * 2)
        .attr("clip-path", d => `url(#clip-${d.id})`)
        .attr("preserveAspectRatio", "xMidYMid slice");

      node.append("text")
        .attr("class", "node-name")
        .attr("y", 26)
        .text(d => people[d.id].name);

      node.append("text")
        .attr("class", "node-title")
        .attr("y", 45)
        .text(d => people[d.id].title);
    }

    function showCharacterSheet(id) {
      const person = people[id];

      document.querySelector("#character-sheet-content").innerHTML = `
        <div class="character-header">
          <img src="${person.image}" alt="${person.name}">
          <div>
            <h1>${person.name}</h1>
            <h2>${person.title}</h2>
          </div>
        </div>

        <div class="character-meta">
          <div class="meta-card">
            <strong>House</strong>
            ${person.house}
          </div>
          <div class="meta-card">
            <strong>Realm / Affiliation</strong>
            ${person.realm}
          </div>
          <div class="meta-card">
            <strong>Born</strong>
            ${person.born}
          </div>
        </div>

        <div class="character-section">
          <p>${person.bio}</p>
        </div>
      `;

      document.querySelector("#character-sheet").classList.remove("hidden");
    }

    drawTree().catch(error => {
      console.error("Failed to draw family tree:", error);
      const tree = document.querySelector("#tree");
      const errorBox = document.createElement("pre");
      errorBox.className = "tree-error-box";
      errorBox.textContent = error.message;
      tree.appendChild(errorBox);
    });
  </script>
</body>
</html>
