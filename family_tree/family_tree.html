<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Middle-earth Family Trees</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="family_tree.css" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <script src="../plugins/atlas-map-nav.js"></script>
</head>

<body class="family-tree-page">
  <div id="tree">
    <nav class="atlas-map-nav" aria-label="Atlas navigation">
      <button id="reset-view" type="button">Reset View</button>
      <a class="atlas-map-nav__link atlas-map-nav__link--home" href="../index.html">
        <i class="material-icons">home</i>
        <span>Home</span>
      </a>

      <details class="atlas-map-nav__menu">
        <summary class="atlas-map-nav__toggle">
          <span class="atlas-map-nav__toggle-label">
            <i class="material-icons">map</i>
            <span>Maps</span>
          </span>
          <i class="material-icons atlas-map-nav__chevron">expand_more</i>
        </summary>

        <div class="atlas-map-nav__dropdown">
          <a class="atlas-map-nav__link" href="../maps/middle_earth/middle-earth.html">
            <i class="material-icons">map</i>
            <span>Middle-earth</span>
          </a>
          <a class="atlas-map-nav__link" href="../maps/numenor/numenor.html">
            <i class="material-icons">map</i>
            <span>Numenor</span>
          </a>
          <a class="atlas-map-nav__link" href="../maps/beleriand/beleriand.html">
            <i class="material-icons">map</i>
            <span>Beleriand</span>
          </a>
          <a class="atlas-map-nav__link" href="../maps/the_shire/the_shire.html">
            <i class="material-icons">map</i>
            <span>The Shire</span>
          </a>
        </div>
      </details>

      <details class="atlas-map-nav__menu">
        <summary class="atlas-map-nav__toggle">
          <span class="atlas-map-nav__toggle-label">
            <i class="material-icons">account_tree</i>
            <span>Family Tree</span>
          </span>
          <i class="material-icons atlas-map-nav__chevron">expand_more</i>
        </summary>

        <div class="atlas-map-nav__dropdown">
          <a class="atlas-map-nav__link atlas-map-nav__link--current" href="family_tree.html" aria-current="page">
            <i class="material-icons">account_tree</i>
            <span>Family Tree</span>
          </a>
        </div>
      </details>
    </nav>

    <aside class="tree-view-panel" aria-labelledby="tree-view-title">
      <p class="tree-view-panel__eyebrow">Canonical Tree View</p>
      <h1 id="tree-view-title">Family Tree</h1>

      <label class="tree-view-panel__field" for="tree-view">
        <span>Switch view</span>
        <select id="tree-view"></select>
      </label>

      <p id="tree-view-description" class="tree-view-panel__description"></p>
      <p id="tree-view-stats" class="tree-view-panel__stats" aria-live="polite"></p>
    </aside>

    <div id="family-tree-host" aria-label="Family tree canvas"></div>

    <div id="tree-empty-state" class="tree-empty-state hidden" role="status" aria-live="polite">
      <div class="tree-empty-state__card">
        <p class="tree-empty-state__eyebrow">Planned View</p>
        <h2 id="tree-empty-title"></h2>
        <p id="tree-empty-body"></p>
      </div>
    </div>

    <div class="hint">Drag to pan | Scroll to zoom | Click a person for details</div>
  </div>

  <section id="character-sheet" class="character-sheet hidden">
    <div class="character-sheet__inner">
      <button id="back-to-tree" class="back-button" type="button">&lt;- Back to family tree</button>
      <div id="character-sheet-content"></div>
    </div>
  </section>

  <script src="../plugins/familytree.js"></script>
  <script src="family_tree_data.js"></script>
  <script src="family_tree.js"></script>
</body>
</html>
