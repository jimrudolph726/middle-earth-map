<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Middle-earth Atlas</title>
    <link rel="stylesheet" href="splash.css">
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
</head>
<body class="splash-body">
    <main class="splash-shell">
        <section class="splash-panel">
            <!-- <p class="splash-kicker">A Cartographer's Table</p> -->
            <h1 class="splash-title">Tolkien Legendarium Atlas</h1>
            <p class="splash-copy">
                Make yourself at home in Bilbo Baggins' study room and choose a map or genealogy to get started.
            </p>

            <div class="splash-table" aria-label="Bag End study selection">
                <div class="study-hotspots">
                    <a class="study-hotspot study-hotspot--middle-earth" href="maps/middle_earth/middle-earth.html" aria-label="Open the Middle-earth map">
                        <span class="study-hotspot__label">Middle-earth</span>
                    </a>

                    <a class="study-hotspot study-hotspot--the-shire" href="maps/the_shire/the_shire.html" aria-label="Open The Shire map">
                        <span class="study-hotspot__label">The Shire</span>
                    </a>

                    <a class="study-hotspot study-hotspot--numenor" href="maps/numenor/numenor.html" aria-label="Open the Numenor map">
                        <span class="study-hotspot__label">Numenor</span>
                    </a>

                    <a class="study-hotspot study-hotspot--beleriand" href="maps/beleriand/beleriand.html" aria-label="Open the Beleriand map">
                        <span class="study-hotspot__label">Beleriand</span>
                    </a>

                    <a class="study-hotspot study-hotspot--family-tree" href="family_tree/family_tree.html" aria-label="Open the family tree">
                        <span class="study-hotspot__label">Family Tree</span>
                    </a>
                </div>
            </div>

            <p class="splash-blessing">Elen sila lumenn' omentielvo</p>
        </section>
    </main>
</body>
</html>
