<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="title description">
  <title id="title">Númenórean city medallion</title>
  <desc id="description">An original atlas emblem: a white stone tower beneath a silver star, framed by an indigo field and an antique-bronze circular rim.</desc>
  <defs>
    <radialGradient id="field" cx="38%" cy="28%" r="74%">
      <stop offset="0" stop-color="#1d5272"/>
      <stop offset="0.55" stop-color="#0a2b43"/>
      <stop offset="1" stop-color="#061924"/>
    </radialGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0d493"/>
      <stop offset="0.32" stop-color="#b8843f"/>
      <stop offset="0.68" stop-color="#6f4824"/>
      <stop offset="1" stop-color="#d3ad62"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4d1d1"/>
      <stop offset="0.3" stop-color="#fffbed"/>
      <stop offset="0.7" stop-color="#e8ebe3"/>
      <stop offset="1" stop-color="#9aafb8"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#e4eeee"/>
      <stop offset="1" stop-color="#8aa4b2"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.8" flood-color="#02070a" flood-opacity="0.72"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <circle cx="32" cy="31" r="29" fill="#07131a" stroke="#342214" stroke-width="1"/>
    <circle cx="32" cy="31" r="27.4" fill="url(#bronze)"/>
    <circle cx="32" cy="31" r="24.2" fill="url(#field)" stroke="#d7e1e1" stroke-width="1.1"/>
    <circle cx="32" cy="31" r="21.7" fill="none" stroke="#d0a85f" stroke-width="0.7" opacity="0.45"/>

    <!-- Broad architectural shapes remain legible at the 48px marker size. -->
    <path d="M22 26v-4h4v4h4v-4h4v4h4v-4h4v8l-3 2v13l3 3v3H22v-3l3-3V32l-3-2Z"
          fill="url(#stone)" stroke="#557482" stroke-width="0.9" stroke-linejoin="round"/>
    <path d="M25 32h14M23 48h18" fill="none" stroke="#829da6" stroke-width="1"/>
    <path d="M29 51V43a3 3 0 0 1 6 0v8Z" fill="#082539"/>
    <path d="M30.5 37v-2a1.5 1.5 0 0 1 3 0v2Z" fill="#34566a"/>
    <path d="M26.5 33v12" fill="none" stroke="#fffdf1" stroke-width="1" opacity="0.8"/>

    <!-- The detached star is shared visual language, not a claimed historic device. -->
    <path d="m32 8 1.7 4.7 4.3-1.8-1.8 4.3L41 17l-4.8 1.7 1.8 4.3-4.3-1.8L32 26l-1.7-4.8-4.3 1.8 1.8-4.3L23 17l4.8-1.8-1.8-4.3 4.3 1.8Z"
          transform="translate(0 -1) scale(1 0.8)" fill="url(#silver)" stroke="#f1f6f4" stroke-width="0.7" stroke-linejoin="round"/>
    <circle cx="32" cy="12.6" r="1.2" fill="#ffffff"/>
  </g>
</svg>
