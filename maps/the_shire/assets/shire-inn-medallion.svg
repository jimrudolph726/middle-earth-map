<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="title description">
  <title id="title">Shire inns and gathering places medallion</title>
  <desc id="description">A hanging wooden inn sign bearing a cream tankard, suspended from a rustic bracket on a sage field within a honey-gold rim. A symbolic inn sign, not a reconstruction of a particular establishment's device.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f1e4c3"/><stop offset=".28" stop-color="#e6c96b"/><stop offset=".65" stop-color="#946a2b"/><stop offset="1" stop-color="#c99a3a"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#a3af80"/><stop offset=".4" stop-color="#87936a"/><stop offset="1" stop-color="#535e3f"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#92603d"/><stop offset=".5" stop-color="#65432c"/><stop offset="1" stop-color="#493321"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="31" r="29" fill="#393b2b" stroke="#5c4326"/>
  <circle cx="32" cy="31" r="27.4" fill="url(#gold)"/>
  <circle cx="32" cy="31" r="24.2" fill="url(#field)" stroke="#f1e4c3" stroke-width="1.1"/>
  <!-- Broad bracket and sign silhouette stay distinct at the 48px marker size. -->
  <path d="M15 50V14H47M16 26 27 15" fill="none" stroke="#393b2b" stroke-width="4.8" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M15 50V14H47M16 26 27 15" fill="none" stroke="#b98355" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M27 15v9M43 15v9" fill="none" stroke="#393b2b" stroke-width="2.8"/>
  <path d="M27 15v9M43 15v9" fill="none" stroke="#e6c96b" stroke-width="1.2"/>
  <path d="M22 24Q35 20 49 24V46Q35 50 22 46Z" fill="url(#wood)" stroke="#e6c96b" stroke-width="1.3" stroke-linejoin="round"/>
  <path d="M25 27Q35 24 46 27M25 44Q35 47 46 44" fill="none" stroke="#c99a3a" stroke-width=".7" opacity=".65"/>
  <!-- A simple painted tankard stands for hospitality rather than any specific inn's heraldry. -->
  <path d="M38 31h3a4 4 0 0 1 0 8h-3" fill="none" stroke="#f1e4c3" stroke-width="2.8"/>
  <path d="M29 29h10v12q-5 3-10 0Z" fill="#f1e4c3" stroke="#d3b474" stroke-width=".9"/>
  <path d="M32 32v7M36 32v7" stroke="#c99a3a" stroke-width="1"/>
  <path d="M28 29h12" stroke="#fff5d7" stroke-width="2" stroke-linecap="round"/>
</svg>
