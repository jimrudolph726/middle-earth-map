<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="title description">
  <title id="title">Shire towns and villages medallion</title>
  <desc id="description">Three round hobbit doors nestled in a sage hillside: a larger butter-yellow door between two terracotta doors, with a cream path and honey-gold circular frame.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f1e4c3"/><stop offset=".28" stop-color="#e6c96b"/><stop offset=".65" stop-color="#946a2b"/><stop offset="1" stop-color="#c99a3a"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f1e4c3"/><stop offset="1" stop-color="#d7bd77"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#a3af80"/><stop offset=".4" stop-color="#87936a"/><stop offset="1" stop-color="#535e3f"/>
    </linearGradient>
    <clipPath id="field"><circle cx="32" cy="31" r="24"/></clipPath>
  </defs>
  <circle cx="32" cy="31" r="29" fill="#393b2b" stroke="#5c4326"/>
  <circle cx="32" cy="31" r="27.4" fill="url(#gold)"/>
  <circle cx="32" cy="31" r="24.2" fill="url(#sky)" stroke="#f1e4c3" stroke-width="1.1"/>
  <g clip-path="url(#field)">
    <!-- One broad hillside and three contrasting doors remain legible at 48px. -->
    <path d="M5 34Q12 23 20 25Q31 10 43 24Q53 24 59 35V58H5Z" fill="url(#hill)" stroke="#596446" stroke-width="1"/>
    <path d="M6 34Q14 25 21 27Q32 14 43 26Q53 26 59 36" fill="none" stroke="#bbc394" stroke-width="1.4"/>
    <path d="M30 41Q34 46 25 57H40Q43 49 34 41Z" fill="#f1e4c3"/>
    <path d="M30 43Q35 48 30 54" fill="none" stroke="#d2b677" stroke-width="1.1"/>
    <g stroke="#393b2b" stroke-width="1.3">
      <circle cx="17" cy="35" r="6.2" fill="#d8c89e"/>
      <circle cx="47" cy="35" r="6.2" fill="#d8c89e"/>
      <circle cx="32" cy="33" r="9.4" fill="#e2d1a5"/>
      <circle cx="17" cy="35" r="4.8" fill="#a85f42"/>
      <circle cx="47" cy="35" r="4.8" fill="#a85f42"/>
      <circle cx="32" cy="33" r="7.7" fill="#e6c96b"/>
    </g>
    <path d="M29 27v12M32 26v14M35 27v12" fill="none" stroke="#a77b32" stroke-width=".65" opacity=".75"/>
    <path d="M27 41h10M13 41h8M43 41h8" fill="none" stroke="#f1e4c3" stroke-width="1.4" stroke-linecap="round"/>
    <g fill="#393b2b"><circle cx="32" cy="33.5" r="1.2"/><circle cx="17" cy="35" r=".8"/><circle cx="47" cy="35" r=".8"/></g>
  </g>
  <circle cx="32" cy="31" r="24.2" fill="none" stroke="#f1e4c3" stroke-width="1.1"/>
</svg>
